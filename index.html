<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魏晉南北朝 沉浸式遊戲</title>
<style>
  @import url('https://cdn.jsdelivr.net/npm/fontsource-noto-serif-tc@4.0.0/chinese-traditional-400.css');
  @import url('https://cdn.jsdelivr.net/npm/fontsource-noto-serif-tc@4.0.0/chinese-traditional-700.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif TC', serif;
    overflow: hidden;
    background: #0a0a0a;
    user-select: none;
  }

  #game-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* 背景層 */
  #bg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    background-color: #1a0a2e;
    transition: background-image 0.8s ease;
    z-index: 1;
  }

  #bg-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.5) 100%);
    z-index: 2;
  }

  /* 標題畫面 */
  #title-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
  }

  .title-content {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .title-main {
    font-size: 4rem;
    font-weight: 700;
    color: #f0e6d3;
    text-shadow: 0 0 40px rgba(212, 175, 55, 0.5), 0 4px 8px rgba(0,0,0,0.5);
    letter-spacing: 0.2em;
    margin-bottom: 1rem;
    animation: titleFloat 3s ease-in-out infinite;
  }

  .title-sub {
    font-size: 1.5rem;
    color: #d4af37;
    letter-spacing: 0.3em;
    margin-bottom: 3rem;
    text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
  }

  @keyframes titleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .title-btn {
    padding: 16px 48px;
    font-size: 1.3rem;
    font-family: 'Noto Serif TC', serif;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
    border: 2px solid rgba(212, 175, 55, 0.5);
    color: #f0e6d3;
    cursor: pointer;
    letter-spacing: 0.2em;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    border-radius: 8px;
  }

  .title-btn:hover {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.35), rgba(212, 175, 55, 0.15));
    border-color: #d4af37;
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
  }

  /* 對話框 */
  #dialogue-box {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 50;
    padding: 0 3% 2%;
    display: none;
  }

  .dialogue-inner {
    background: linear-gradient(180deg, rgba(10, 10, 30, 0.88) 0%, rgba(10, 10, 30, 0.95) 100%);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    padding: 24px 30px;
    backdrop-filter: blur(15px);
    position: relative;
    min-height: 180px;
    max-height: 40vh;
    overflow-y: auto;
    cursor: pointer;
  }

  .dialogue-inner::before {
    content: '';
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
  }

  .speaker-name {
    position: absolute;
    top: -18px;
    left: 30px;
    background: linear-gradient(135deg, #d4af37, #b8860b);
    color: #1a0a2e;
    padding: 4px 20px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 4px;
    letter-spacing: 0.1em;
  }

  .speaker-name.narrator {
    background: linear-gradient(135deg, #8b7355, #6b5b45);
    color: #f0e6d3;
  }

  .dialogue-text {
    color: #f0e6d3;
    font-size: 1.1rem;
    line-height: 1.9;
    min-height: 80px;
    padding-top: 10px;
    letter-spacing: 0.05em;
    white-space: pre-wrap;
  }

  .dialogue-text .cursor-blink {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: #d4af37;
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .dialogue-continue {
    position: absolute;
    bottom: 12px;
    right: 25px;
    color: #d4af37;
    font-size: 0.85rem;
    animation: continueBounce 1.5s ease-in-out infinite;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .dialogue-continue.show { opacity: 1; }

  @keyframes continueBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  /* 選項按鈕 */
  #choices-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 45;
    display: none;
    flex-direction: column;
    gap: 12px;
    width: 650px;
    max-width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .choice-btn {
    padding: 16px 24px;
    font-size: 1.05rem;
    font-family: 'Noto Serif TC', serif;
    background: linear-gradient(135deg, rgba(26, 10, 46, 0.92), rgba(22, 33, 62, 0.92));
    border: 1px solid rgba(212, 175, 55, 0.4);
    color: #f0e6d3;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.3s ease;
    text-align: left;
    border-radius: 6px;
  }

  .choice-btn:hover {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.1));
    border-color: #d4af37;
    transform: translateX(8px);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
  }

  .choice-btn .choice-num {
    color: #d4af37;
    margin-right: 10px;
    font-weight: 700;
  }

  /* 輸入框 */
  #input-area {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 60;
    display: none;
    flex-direction: column;
    gap: 15px;
    width: 500px;
    max-width: 90%;
    background: rgba(10, 10, 30, 0.85);
    padding: 30px;
    border-radius: 12px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    backdrop-filter: blur(15px);
  }

  #input-area .input-title {
    color: #d4af37;
    font-size: 1.3rem;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 0.15em;
  }

  .name-input {
    padding: 14px 20px;
    border: 1px solid rgba(212, 175, 55, 0.4);
    border-radius: 8px;
    font-size: 1.1rem;
    width: 100%;
    box-sizing: border-box;
    font-family: 'Noto Serif TC', serif;
    background: rgba(10, 10, 30, 0.8);
    color: #f0e6d3;
    backdrop-filter: blur(10px);
  }

  .name-input::placeholder {
    color: rgba(240, 230, 211, 0.5);
  }

  .name-input:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
  }

  /* 河道與酒杯 */
  #river-path-container {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 800px;
    height: 60px;
    z-index: 8;
    overflow: hidden;
    display: none;
    background: linear-gradient(to right, #a5d8f3, #72c6e6);
    border-radius: 30px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 4px 20px rgba(0,0,0,0.3);
  }

  #wine-cup {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 50px;
    height: 50px;
    background-color: #fff;
    border-radius: 50%;
    border: 2px solid #8c7851;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
  }

  @keyframes float-cup {
    0% { left: 0%; transform: translateY(-50%) rotate(0deg); }
    50% { left: 50%; transform: translateY(-50%) rotate(30deg); }
    100% { left: 100%; transform: translateY(-50%) rotate(60deg); }
  }

  /* 訊息框 */
  #message-box {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 70;
    background: rgba(252, 228, 236, 0.95);
    color: #ad1457;
    padding: 15px 30px;
    border-radius: 8px;
    font-size: 1.1rem;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    text-align: center;
  }

  /* 玩家資訊 */
  #user-info {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 60;
    color: #d4af37;
    font-size: 0.9rem;
    background: rgba(10, 10, 30, 0.7);
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    backdrop-filter: blur(5px);
    display: none;
  }

  /* UI 按鈕 */
  #ui-buttons {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 60;
    display: none;
    gap: 8px;
  }

  .ui-btn {
    width: 40px;
    height: 40px;
    background: rgba(10, 10, 30, 0.7);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: #d4af37;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
    position: relative;
  }

  .ui-btn:hover {
    background: rgba(212, 175, 55, 0.2);
    border-color: #d4af37;
  }

  .ui-btn.playing {
    animation: musicPulse 2s ease-in-out infinite;
  }

  @keyframes musicPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
    50% { box-shadow: 0 0 15px 3px rgba(212, 175, 55, 0.3); }
  }

  /* 音量滑桿 */
  #volume-control {
    position: absolute;
    top: 65px;
    right: 15px;
    z-index: 60;
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(10, 10, 30, 0.85);
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    backdrop-filter: blur(10px);
  }

  #volume-control.show {
    display: flex;
  }

  #volume-slider {
    width: 100px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(212, 175, 55, 0.3);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  #volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    background: #d4af37;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
  }

  #volume-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: #d4af37;
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
  }

  #volume-label {
    color: #d4af37;
    font-size: 0.8rem;
    min-width: 30px;
    text-align: center;
  }

  /* 音樂曲目選擇 */
  #music-menu {
    position: absolute;
    top: 65px;
    right: 15px;
    z-index: 60;
    display: none;
    flex-direction: column;
    gap: 6px;
    background: rgba(10, 10, 30, 0.9);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    backdrop-filter: blur(15px);
    min-width: 180px;
  }

  #music-menu.show {
    display: flex;
  }

  .music-menu-title {
    color: #d4af37;
    font-size: 0.85rem;
    text-align: center;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    margin-bottom: 4px;
    letter-spacing: 0.1em;
  }

  .music-option {
    padding: 8px 12px;
    background: transparent;
    border: 1px solid rgba(212, 175, 55, 0.2);
    color: #f0e6d3;
    font-family: 'Noto Serif TC', serif;
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.3s;
    text-align: left;
  }

  .music-option:hover {
    background: rgba(212, 175, 55, 0.15);
    border-color: #d4af37;
  }

  .music-option.active {
    background: rgba(212, 175, 55, 0.25);
    border-color: #d4af37;
    color: #d4af37;
  }

  /* 粒子效果 */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(212, 175, 55, 0.6);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    animation: particleFloat 4s ease-in-out infinite;
  }

  @keyframes particleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
    25% { opacity: 1; }
    75% { opacity: 0.5; }
    100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
  }

  /* 響應式 */
  @media (max-width: 768px) {
    .title-main { font-size: 2.5rem; }
    .title-sub { font-size: 1.2rem; }
    .dialogue-text { font-size: 1rem; }
    #choices-container { width: 90%; }
    #input-area { width: 90%; }
    .dialogue-inner { padding: 20px; min-height: 150px; }
    #volume-slider { width: 70px; }
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="bg-layer"></div>
  <div id="bg-overlay"></div>

  <!-- 標題畫面 -->
  <div id="title-screen">
    <div class="title-content">
      <div class="title-main">魏晉南北朝</div>
      <div class="title-sub">沉 浸 式 遊 戲</div>
      <button class="title-btn" onclick="showInputArea()">☕ 進入遊戲</button>
    </div>
  </div>

  <!-- 輸入區域 -->
  <div id="input-area">
    <div class="input-title">請輸入你的姓名</div>
    <input type="text" id="player-name-input" class="name-input" placeholder="請輸入你的姓名...">
    <button class="choice-btn" onclick="startGame()" style="text-align:center;">進入遊戲</button>
  </div>

  <!-- UI 按鈕 -->
  <div id="ui-buttons">
    <button class="ui-btn" id="music-btn" onclick="toggleMusicMenu(event)" title="音樂">♪</button>
    <button class="ui-btn" onclick="toggleAuto()" title="自動播放">▶</button>
    <button class="ui-btn" onclick="backToTitle()" title="返回標題">⌂</button>
  </div>

  <!-- 音樂選單 -->
  <div id="music-menu">
    <div class="music-menu-title">🎵 背景音樂</div>
    <button class="music-option active" data-track="guqin" onclick="switchTrack('guqin', event)">🎼 古琴悠韻</button>
    <button class="music-option" data-track="bamboo" onclick="switchTrack('bamboo', event)">🎋 竹林清風</button>
    <button class="music-option" data-track="stream" onclick="switchTrack('stream', event)">💧 曲水流觴</button>
    <button class="music-option" data-track="moonlight" onclick="switchTrack('moonlight', event)">🌙 月下獨酌</button>
    <button class="music-option" data-track="off" onclick="switchTrack('off', event)">🔇 關閉音樂</button>
  </div>

  <!-- 音量控制 -->
  <div id="volume-control">
    <span style="color:#d4af37;font-size:0.8rem;">🔊</span>
    <input type="range" id="volume-slider" min="0" max="100" value="40">
    <span id="volume-label">40%</span>
  </div>

  <!-- 玩家資訊 -->
  <div id="user-info"></div>

  <!-- 河道與酒杯 -->
  <div id="river-path-container">
    <div id="wine-cup">☕</div>
  </div>

  <!-- 對話框 -->
  <div id="dialogue-box">
    <div class="dialogue-inner" onclick="advanceDialogue()">
      <div class="speaker-name narrator" id="speaker-name">旁白</div>
      <div class="dialogue-text" id="dialogue-text"></div>
      <div class="dialogue-continue" id="dialogue-continue">▼ 點擊繼續</div>
    </div>
  </div>

  <!-- 選項 -->
  <div id="choices-container"></div>

  <!-- 訊息框 -->
  <div id="message-box"></div>
</div>

<script>
// ============ 音樂系統 - Web Audio API ============
let audioCtx = null;
let masterGain = null;
let musicPlaying = false;
let currentTrack = 'guqin';
let musicTimers = [];
let activeOscillators = [];
let musicMenuOpen = false;

// 五聲音階頻率（宮商角徵羽）- 符合中國古典風格
const PENTATONIC = {
  // 低音區
  gong1: 130.81,  // 宮 C3
  shang1: 146.83, // 商 D3
  jue1: 164.81,   // 角 E3
  zhi1: 196.00,   // 徵 G3
  yu1: 220.00,    // 羽 A3
  // 中音區
  gong2: 261.63,  // 宮 C4
  shang2: 293.66, // 商 D4
  jue2: 329.63,   // 角 E4
  zhi2: 392.00,   // 徵 G4
  yu2: 440.00,    // 羽 A4
  // 高音區
  gong3: 523.25,  // 宮 C5
  shang3: 587.33, // 商 D5
  jue3: 659.25,   // 角 E5
  zhi3: 783.99,   // 徵 G5
  yu3: 880.00     // 羽 A5
};

// 初始化音訊系統
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    
    // 加入混響效果（使用 convolver 模擬）
    const reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.3;
    
    masterGain.connect(audioCtx.destination);
  } catch (e) {
    console.warn('Web Audio API 不支援：', e);
  }
}

// 播放單個音符（古琴音色）
function playGuqinNote(freq, startTime, duration, volume = 0.3) {
  if (!audioCtx) return;
  
  // 主振盪器（正弦波，模擬古琴）
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  
  // 第二個振盪器（模擬泛音）
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  
  // 第三個振盪器（高次泛音）
  const osc3 = audioCtx.createOscillator();
  osc3.type = 'sine';
  osc3.frequency.value = freq * 3;
  
  // 增益包絡（ADSR）
  const gainNode = audioCtx.createGain();
  const gain2 = audioCtx.createGain();
  const gain3 = audioCtx.createGain();
  
  gain2.gain.value = 0.15; // 泛音音量較小
  gain3.gain.value = 0.05;
  
  // ADSR 包絡
  gainNode.gain.setValueAtTime(0, startTime);
  gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.05); // Attack
  gainNode.gain.exponentialRampToValueAtTime(volume * 0.6, startTime + 0.3); // Decay
  gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration); // Release
  
  // 連接
  osc.connect(gainNode);
  osc2.connect(gain2);
  osc2.connect(gainNode);
  osc3.connect(gain3);
  osc3.connect(gainNode);
  gainNode.connect(masterGain);
  
  osc.start(startTime);
  osc2.start(startTime);
  osc3.start(startTime);
  osc.stop(startTime + duration);
  osc2.stop(startTime + duration);
  osc3.stop(startTime + duration);
  
  activeOscillators.push(osc, osc2, osc3);
}

// 播放笛子音色
function playFluteNote(freq, startTime, duration, volume = 0.2) {
  if (!audioCtx) return;
  
  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  
  // 顫音
  const vibrato = audioCtx.createOscillator();
  const vibratoGain = audioCtx.createGain();
  vibrato.frequency.value = 5;
  vibratoGain.gain.value = 3;
  vibrato.connect(vibratoGain);
  vibratoGain.connect(osc.frequency);
  
  const gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0, startTime);
  gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.1);
  gainNode.gain.linearRampToValueAtTime(volume * 0.8, startTime + duration * 0.7);
  gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  
  osc.connect(gainNode);
  gainNode.connect(masterGain);
  
  osc.start(startTime);
  vibrato.start(startTime);
  osc.stop(startTime + duration);
  vibrato.stop(startTime + duration);
  
  activeOscillators.push(osc, vibrato);
}

// 播放流水環境音
function playWaterAmbience(startTime, duration) {
  if (!audioCtx) return;
  
  // 使用噪聲模擬流水
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  
  // 生成粉紅噪聲（較柔和）
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    b0 = 0.99 * b0 + 0.03 * white;
    b1 = 0.98 * b1 + 0.04 * white;
    b2 = 0.96 * b2 + 0.08 * white;
    data[i] = (b0 + b1 + b2) * 0.1;
  }
  
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  
  // 低通濾波器，使聲音更柔和
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 800;
  
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.15;
  
  source.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(masterGain);
  
  source.start(startTime);
  source.stop(startTime + duration);
}

// 播放風聲環境音
function playWindAmbience(startTime, duration) {
  if (!audioCtx) return;
  
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  
  let last = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    last = last * 0.98 + white * 0.02;
    data[i] = last * 2;
  }
  
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 400;
  filter.Q.value = 0.5;
  
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.08;
  
  source.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(masterGain);
  
  source.start(startTime);
  source.stop(startTime + duration);
}

// 停止所有音樂
function stopAllMusic() {
  musicTimers.forEach(t => clearTimeout(t));
  musicTimers = [];
  
  activeOscillators.forEach(osc => {
    try { osc.stop(); } catch (e) {}
  });
  activeOscillators = [];
}

// 切換曲目
function switchTrack(track, event) {
  if (event) event.stopPropagation();
  
  currentTrack = track;
  
  // 更新選單 UI
  document.querySelectorAll('.music-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.track === track);
  });
  
  if (track === 'off') {
    stopAllMusic();
    musicPlaying = false;
    document.getElementById('music-btn').classList.remove('playing');
    document.getElementById('music-btn').textContent = '♪';
    document.getElementById('volume-control').classList.remove('show');
    return;
  }
  
  initAudio();
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  
  musicPlaying = true;
  document.getElementById('music-btn').classList.add('playing');
  document.getElementById('music-btn').textContent = '♫';
  document.getElementById('volume-control').classList.add('show');
  
  // 根據曲目播放
  switch (track) {
    case 'guqin': playGuqinTrack(); break;
    case 'bamboo': playBambooTrack(); break;
    case 'stream': playStreamTrack(); break;
    case 'moonlight': playMoonlightTrack(); break;
  }
  
  // 關閉選單
  setTimeout(() => {
    document.getElementById('music-menu').classList.remove('show');
    musicMenuOpen = false;
  }, 200);
}

// 切換音樂選單
function toggleMusicMenu(event) {
  event.stopPropagation();
  musicMenuOpen = !musicMenuOpen;
  document.getElementById('music-menu').classList.toggle('show', musicMenuOpen);
  
  // 如果選單打開時音量控制也顯示，則隱藏
  if (musicMenuOpen) {
    document.getElementById('volume-control').classList.remove('show');
  } else if (musicPlaying) {
    document.getElementById('volume-control').classList.add('show');
  }
}

// 音量控制
document.getElementById('volume-slider').addEventListener('input', (e) => {
  const vol = e.target.value / 100;
  if (masterGain) {
    masterGain.gain.value = vol;
  }
  document.getElementById('volume-label').textContent = e.target.value + '%';
});

// 點擊其他地方關閉選單
document.addEventListener('click', (e) => {
  if (!e.target.closest('#music-menu') && !e.target.closest('#music-btn')) {
    document.getElementById('music-menu').classList.remove('show');
    musicMenuOpen = false;
  }
});

      choices: [
        { text: '南渡，追隨世家大族建立東晉', nextScene: 'easternJinMigration' },
        { text: '留在北方，掙扎求存', nextScene: 'surviveInNorth' }
      ]
    },
    'easternJinMigration': {
      text: '你選擇了南渡。這是一段艱辛的旅程，你與無數士人百姓一同跨越長江，來到江南。你見證了司馬睿在王導、王敦等世家大族的扶持下，在建康（今南京）建立了東晉政權。你雖然失去了故土，但在南方，你找到了新的生存空間，並在新的政權中扮演著重要的角色。',
      image: 'easternJinMigration',
      choices: [
        { text: '參與王羲之、謝安等名士舉辦的蘭亭雅集', nextScene: 'lantingGatheringEvent' },
        { text: '開啟東晉新篇章，重新開始遊戲', nextScene: 'opening' }
      ]
    },
    'lantingGatheringEvent': {
      text: '公元353年三月初三，會稽山陰之蘭亭，你參與了由王羲之、謝安、孫綽等四十一位名士舉辦的蘭亭雅集。群賢畢至，少長咸集，眾人席地而坐，暢飲詩酒。清澈的溪水蜿蜒曲折，酒杯沿著水流緩緩漂下。杯子停在誰的面前，誰就必須吟詩一首，否則便要罰酒三杯。\n\n你感受著春日和煦的微風，仰望著澄澈蔚藍的天空，俯視著流動的清溪，暢遊在「足以極視聽之娛」的自然美景中。你與友人談笑風生，放縱形骸，這是一個遠離塵世喧囂，暫時忘卻亂世煩憂的「盛事」。然而，在盡情享受歡樂的同時，你也隱約感受到一種深藏的憂愁。在王羲之的《蘭亭集序》中，他寫道：「向之所欣，俯仰之間，已為陳跡，猶不能不以之興懷。」你突然意識到，眼前這份美好，終將隨時間消逝。而人生，不過是「死生亦大矣」，這短暫的歡愉之後，仍是無盡的悲哀與虛無。',
      image: 'lantingGatheringEvent',
      choices: [
        { text: '參與曲水流觴，與眾人一同猜謎作對', nextScene: 'windingStreamGame' },
      ]
    },
    'windingStreamGame': {
      text: '歡迎來到曲水流觴！這是一個充滿雅趣的遊戲。在座的每一位都將面臨一個謎題，當酒杯流經你面前而你未完成猜謎時，就必須罰酒三杯。',
      image: 'windingStreamGame',
      specialAction: 'startRiddle'
    },
    'lantingGatheringAftermath': {
      text: '雅集結束後，眾人將所賦詩作彙編成冊。王羲之親自為此寫下序言，便是流傳千古的《蘭亭集序》。他在序文中寫道：「後之視今，亦猶今之視昔。」這句話讓你深感震撼，你意識到，我們對古人的懷念與感嘆，也正是未來之人對我們的看法。生命短暫，但詩文與思想卻能永恆傳承。你參與了這場盛會，也將這份感悟銘記於心。',
      image: 'lantingGatheringAftermath',
      choices: [
        { text: '回到東晉主線，繼續你的旅程', nextScene: 'joinXieClan' }
      ]
    },
    'surviveInNorth': {
      text: '你選擇了留在北方。在胡人政權的統治下，你必須學會適應新的社會規則。曾經的漢人貴族與士大夫階層失去了往日的榮光，家園淪為廢墟，文化傳承面臨斷裂的危機。你曾試圖維護漢人的文化與尊嚴，但發現個人的力量如此渺小。為了生存，你不得不躬耕田畝，過著與昔日清談、詩酒風流截然不同的生活。這是一場文化的失落與生存的掙扎。在充滿挑戰與危險的亂世中，你只能掙扎求存，期待著有朝一日中原能重回安定，讓漢家文化得以復興。',
      image: 'surviveInNorth',
      choices: [{ text: '重新開始遊戲', nextScene: 'opening' }]
    }
  },
  riddles: [
    { riddle: '身輕似燕，腳踏清流，有杯無酒，雅士相求。猜一物？', answer: '酒杯' },
    { riddle: '無口能言，無足能行，來去無蹤，卻能傳情。猜一物？', answer: '書信' },
    { riddle: '生於山林，死於筆下，能言善辯，能書善畫。猜一物？', answer: '毛筆' }
  ],
  currentRiddleIndex: 0
};

// 遊戲狀態
let gameState = {
  isTyping: false,
  typeTimer: null,
  currentText: '',
  charIndex: 0,
  autoPlay: false,
  currentChoices: [],
  specialAction: null,
  riddleTimer: null,
  textComplete: false,
  waitingForClick: false
};

// DOM 元素
const bgLayer = document.getElementById('bg-layer');
const titleScreen = document.getElementById('title-screen');
const inputArea = document.getElementById('input-area');
const nameInput = document.getElementById('player-name-input');
const dialogueBox = document.getElementById('dialogue-box');
const speakerName = document.getElementById('speaker-name');
const dialogueText = document.getElementById('dialogue-text');
const dialogueContinue = document.getElementById('dialogue-continue');
const choicesContainer = document.getElementById('choices-container');
const userInfo = document.getElementById('user-info');
const messageBox = document.getElementById('message-box');
const riverContainer = document.getElementById('river-path-container');
const wineCup = document.getElementById('wine-cup');
const uiButtons = document.getElementById('ui-buttons');

function showInputArea() {
  titleScreen.style.display = 'none';
  inputArea.style.display = 'flex';
  if (images.opening) {
    bgLayer.style.backgroundImage = `url('${images.opening}')`;
  }
  // 初始化音訊（需要用戶互動）
  initAudio();
  // 自動播放音樂
  setTimeout(() => {
    switchTrack('guqin');
  }, 300);
  setTimeout(() => nameInput.focus(), 100);
}

function resetGameState() {
  clearTimeout(gameState.typeTimer);
  clearTimeout(gameState.riddleTimer);
  
  gameState.isTyping = false;
  gameState.currentText = '';
  gameState.charIndex = 0;
  gameState.currentChoices = [];
  gameState.specialAction = null;
  gameState.autoPlay = false;
  gameState.textComplete = false;
  gameState.waitingForClick = false;
  
  gameData.playerName = '';
  gameData.currentScene = 'opening';
  gameData.currentRiddleIndex = 0;
  
  dialogueBox.style.display = 'none';
  choicesContainer.style.display = 'none';
  riverContainer.style.display = 'none';
  uiButtons.style.display = 'none';
  userInfo.style.display = 'none';
  inputArea.style.display = 'none';
  
  dialogueText.innerHTML = '';
  dialogueContinue.classList.remove('show');
  choicesContainer.innerHTML = '';
  nameInput.value = '';
}

function startGame() {
  const name = nameInput.value.trim();
  if (name) {
    gameData.playerName = name;
    inputArea.style.display = 'none';
    dialogueBox.style.display = 'block';
    uiButtons.style.display = 'flex';
    userInfo.style.display = 'block';
    userInfo.textContent = `玩家：${gameData.playerName}`;
    renderScene('eraStart');
  } else {
    showMessage('請輸入你的姓名才能開始遊戲！');
  }
}

function showMessage(message) {
  messageBox.textContent = message;
  messageBox.style.display = 'block';
  setTimeout(() => {
    messageBox.style.display = 'none';
  }, 3000);
}

function renderScene(sceneName) {
  const scene = gameData.scenes[sceneName];
  if (!scene) {
    console.error('場景未找到：', sceneName);
    return;
  }

  gameData.currentScene = sceneName;
  
  clearTimeout(gameState.typeTimer);
  clearTimeout(gameState.riddleTimer);
  gameState.isTyping = false;
  gameState.specialAction = null;
  gameState.textComplete = false;
  gameState.waitingForClick = false;
  
  choicesContainer.style.display = 'none';
  choicesContainer.innerHTML = '';
  riverContainer.style.display = 'none';
  
  if (scene.image && images[scene.image]) {
    bgLayer.style.backgroundImage = `url('${images[scene.image]}')`;
  }

  if (sceneName === 'opening') {
    resetGameState();
    if (images.opening) {
      bgLayer.style.backgroundImage = `url('${images.opening}')`;
    }
    inputArea.style.display = 'flex';
    setTimeout(() => nameInput.focus(), 100);
    return;
  }

  dialogueBox.style.display = 'block';
  uiButtons.style.display = 'flex';
  userInfo.style.display = 'block';
  userInfo.textContent = gameData.playerName ? `玩家：${gameData.playerName}` : '';

  const fullText = scene.text.replace('(前段所取名)', gameData.playerName);
  
  showDialogue('旁白', fullText, scene.choices, scene.specialAction);
}

function showDialogue(speaker, text, choices, specialAction) {
  speakerName.textContent = speaker;
  speakerName.className = 'speaker-name' + (speaker === '旁白' ? ' narrator' : '');
  dialogueContinue.classList.remove('show');
  
  gameState.isTyping = true;
  gameState.currentText = text;
  gameState.charIndex = 0;
  gameState.currentChoices = choices || [];
  gameState.specialAction = specialAction || null;
  gameState.textComplete = false;
  gameState.waitingForClick = false;
  
  dialogueText.innerHTML = '';
  typeText();
}

function typeText() {
  if (gameState.charIndex < gameState.currentText.length) {
    dialogueText.innerHTML = gameState.currentText.substring(0, gameState.charIndex + 1) + '<span class="cursor-blink"></span>';
    gameState.charIndex++;
    gameState.typeTimer = setTimeout(typeText, 50);
  } else {
    dialogueText.innerHTML = gameState.currentText;
    gameState.isTyping = false;
    gameState.textComplete = true;
    dialogueContinue.classList.add('show');
    gameState.waitingForClick = true;
  }
}

function advanceDialogue() {
  if (gameState.isTyping) {
    clearTimeout(gameState.typeTimer);
    dialogueText.innerHTML = gameState.currentText;
    gameState.isTyping = false;
    gameState.textComplete = true;
    dialogueContinue.classList.add('show');
    gameState.waitingForClick = true;
    return;
  }
  
  if (gameState.waitingForClick && gameState.textComplete) {
    gameState.waitingForClick = false;
    dialogueContinue.classList.remove('show');
    
    if (gameState.specialAction === 'startRiddle') {
      setTimeout(() => startRiddleGame(), 300);
    } else if (gameState.currentChoices.length > 0) {
      setTimeout(() => showChoices(gameState.currentChoices), 300);
    }
  }
}

function showChoices(choices) {
  dialogueBox.style.display = 'none';
  choicesContainer.innerHTML = '';
  choicesContainer.style.display = 'flex';

  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-num">${i + 1}.</span>${choice.text}`;
    btn.onclick = () => {
      choicesContainer.style.display = 'none';
      dialogueBox.style.display = 'block';
      renderScene(choice.nextScene);
    };
    choicesContainer.appendChild(btn);
  });
}

function startRiddleGame() {
  dialogueBox.style.display = 'none';
  choicesContainer.innerHTML = '';
  
  wineCup.style.animation = 'none';
  void wineCup.offsetWidth;
  wineCup.style.animation = 'float-cup 8s linear forwards';
  riverContainer.style.display = 'block';

  const randomIndex = Math.floor(Math.random() * gameData.riddles.length);
  gameData.currentRiddleIndex = randomIndex;
  const riddle = gameData.riddles[randomIndex];

  choicesContainer.style.display = 'flex';
  choicesContainer.innerHTML = `
    <div style="color: #f0e6d3; font-size: 1.2rem; text-align: center; margin-bottom: 20px; background: rgba(10,10,30,0.85); padding: 20px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.3); backdrop-filter: blur(10px);">
      在座的雅士們向你投來一個謎題：<br><br>
      <span style="color: #d4af37; font-size: 1.3rem;">「${riddle.riddle}」</span><br><br>
      請在酒杯漂到你面前前，回答這個謎題！
    </div>
    <input type="text" id="riddle-input" class="name-input" placeholder="請輸入你的答案..." style="margin-bottom: 10px;">
    <button class="choice-btn" onclick="checkRiddleAnswer()" style="text-align:center;">提交答案</button>
  `;

  const riddleInput = document.getElementById('riddle-input');
  riddleInput.focus();

  gameState.riddleTimer = setTimeout(() => {
    if (gameData.currentScene === 'windingStreamGame') {
      showMessage('時間到！你沒能答出謎題，只好罰酒三杯。');
      setTimeout(() => {
        renderScene('lantingGatheringAftermath');
      }, 2000);
    }
  }, 8000);
}

function checkRiddleAnswer() {
  const riddleInput = document.getElementById('riddle-input');
  if (!riddleInput) return;
  const userAnswer = riddleInput.value.trim();
  const correctAnswer = gameData.riddles[gameData.currentRiddleIndex].answer;

  clearTimeout(gameState.riddleTimer);

  if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
    showMessage('恭喜！你答對了！展現了你的機智與才學。');
  } else {
    showMessage('很遺憾，答案不對。你只好罰酒三杯了。');
  }

  setTimeout(() => {
    renderScene('lantingGatheringAftermath');
  }, 2000);
}

function toggleAuto() {
  gameState.autoPlay = !gameState.autoPlay;
}

function backToTitle() {
  resetGameState();
  bgLayer.style.backgroundImage = '';
  titleScreen.style.display = 'flex';
  // 停止音樂
  stopAllMusic();
  musicPlaying = false;
  document.getElementById('music-btn').classList.remove('playing');
  document.getElementById('music-btn').textContent = '♪';
  document.getElementById('volume-control').classList.remove('show');
}

// 鍵盤控制
document.addEventListener('keydown', (e) => {
  if (titleScreen.style.display === 'flex') return;
  
  if (inputArea.style.display === 'flex') {
    if (e.key === 'Enter') {
      startGame();
    }
    return;
  }
  
  const riddleInput = document.getElementById('riddle-input');
  if (riddleInput && document.activeElement === riddleInput) {
    if (e.key === 'Enter') {
      checkRiddleAnswer();
    }
    return;
  }
  
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    advanceDialogue();
  } else if (e.key >= '1' && e.key <= '9') {
    const choices = choicesContainer.querySelectorAll('.choice-btn');
    const index = parseInt(e.key) - 1;
    if (choices[index]) choices[index].click();
  } else if (e.key === 'm' || e.key === 'M') {
    toggleMusicMenu(e);
  }
});

// 粒子效果
function createParticles() {
  const container = document.getElementById('game-container');
  setInterval(() => {
    if (titleScreen.style.display !== 'flex') {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = '20%';
      p.style.animationDuration = (3 + Math.random() * 3) + 's';
      container.appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }
  }, 800);
}
createParticles();
</script>
